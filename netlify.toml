[build]
  command = "npm run build"
  publish = "out"

# Production is served from developers.stellar.org, so docs links are relative. Previews keep the absolute address.
[context.production.environment]
  NEXT_PUBLIC_DOCS_BASE = "/docs"

# On developers.stellar.org Cloudflare routes /docs to Mintlify before requests reach Netlify, so these rules never fire there.
# They only serve the review copy at stellar-developers-homepage.netlify.app, so its docs links behave like production.
# Bare /docs first: the wildcard below would proxy "/docs/" and Mintlify answers that with a 308 back to /docs, which loops.
[[redirects]]
  from = "/docs"
  to = "https://stellardevelopmentfoundation.mintlify.site/docs"
  status = 200
  force = true

[[redirects]]
  from = "/docs/*"
  to = "https://stellardevelopmentfoundation.mintlify.site/docs/:splat"
  status = 200
  force = true
